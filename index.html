<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="کارکرد کارگاه">
<title>کارکرد کارگاه</title>

<style>
*{box-sizing:border-box}

body{
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif;
background:#f3f4f6;
margin:0;
color:#111827
}

main{
max-width:720px;
margin:auto;
padding:16px
}

.card{
background:#fff;
border-radius:18px;
padding:17px;
margin:11px 0;
box-shadow:0 4px 18px #0000000d
}

h1,h2,h3{
margin:0 0 12px
}

input,select,button{
width:100%;
padding:13px;
border-radius:12px;
border:1px solid #d1d5db;
margin:5px 0;
font-size:16px
}

button{
background:#111827;
color:#fff;
border:0;
font-weight:700;
cursor:pointer
}

.secondary{
background:#e5e7eb;
color:#111827
}

.danger{
background:#b91c1c
}

.ok{
background:#047857
}

.row{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px
}

.muted{
color:#6b7280;
font-size:13px
}

.item{
border-top:1px solid #eee;
padding:12px 0
}

.money{
font-size:21px;
font-weight:800
}

.hidden{
display:none
}

.pill{
display:inline-block;
padding:5px 9px;
border-radius:999px;
background:#f3f4f6;
font-size:12px
}

.summary{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px
}

.summary .card{
text-align:center;
margin:0
}

.num{
font-size:24px;
font-weight:800
}

.err{
color:#b91c1c
}

.success{
color:#047857
}
</style>
</head>

<body>
<main>
<div id="app"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPA_URL="https://dkwlbxlzzxtsoslzppot.supabase.co";

const SUPA_KEY="sb_publishable__CTj81JM5kWr4DddanPIXQ_8y7Xl2eW";

const API=SUPA_URL+"/functions/v1/kargah";

const sb=supabase.createClient(SUPA_URL,SUPA_KEY);

const app=document.querySelector("#app");


/* =========================
   HELPERS
========================= */

const esc=s=>String(s??"").replace(
/[&<>"']/g,
m=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[m])
);


/* تاریخ شمسی */

function shamsi(dateValue){

if(!dateValue)return "";

const d=new Date(
String(dateValue).length===10
?
dateValue+"T00:00:00"
:
dateValue
);

if(Number.isNaN(d.getTime()))return "";

return new Intl.DateTimeFormat(
"fa-IR-u-ca-persian",
{
year:"numeric",
month:"2-digit",
day:"2-digit"
}
).format(d);

}


/* =========================
   LOGIN
========================= */

function login(){

app.innerHTML=`

<div class="card">

<h1>کارکرد کارگاه</h1>

<p class="muted">
ورود مدیر یا نیرو
</p>

<input
id="loginid"
placeholder="ایمیل مدیر یا کد نیرو"
>

<input
id="pass"
type="password"
placeholder="رمز عبور"
>

<button id="in">
ورود
</button>

<p id="msg" class="muted"></p>

</div>

`;

document.getElementById("in").onclick=async()=>{

msg.textContent="";

const raw=loginid.value.trim();

if(!raw){

msg.textContent="ایمیل یا کد نیرو را وارد کن";

return;

}

if(!pass.value){

msg.textContent="رمز عبور را وارد کن";

return;

}


/*
اگر ورودی @ داشته باشد،
مدیر است.

اگر @ نداشته باشد،
کد نیرو به ایمیل داخلی تبدیل می‌شود.
*/

const email=raw.includes("@")
?
raw
:
(raw.toLowerCase()+"@kargah.local");


const {error}=await sb.auth.signInWithPassword({

email:email,

password:pass.value

});


if(error){

msg.className="err";

msg.textContent=error.message;

}else{

render();

}

};

}


/* =========================
   CURRENT USER
========================= */

async function me(){

const {
data:{user}
}=await sb.auth.getUser();

if(!user)return null;

const {
data:p
}=await sb
.from("profiles")
.select("*")
.eq("id",user.id)
.single();

return p||null;

}


/* =========================
   BOOTSTRAP MANAGER
========================= */

async function bootstrap(){

const {
data:{session}
}=await sb.auth.getSession();

if(!session)return null;

try{

const r=await fetch(
API+"/bootstrap",
{
method:"POST",
headers:{
Authorization:"Bearer "+session.access_token,
apikey:SUPA_KEY,
"Content-Type":"application/json"
}
}
);

return await r.json();

}catch(e){

return {
error:e.message
};

}

}


/* =========================
   RENDER
========================= */

async function render(){

const p=await me();

if(!p){

login();

return;

}

if(p.role==="manager"){

manager(p);

}else{

worker(p);

}

}


/* =========================
   WORKER PANEL
========================= */

async function worker(p){

const [
{data:models},
{data:devices},
{data:entries}
]=await Promise.all([

sb
.from("models")
.select("*")
.eq("active",true)
.order("name"),

sb
.from("devices")
.select("id,name,heads,active")
.eq("active",true)
.order("heads"),

sb
.from("work_entries")
.select("*,model_parts(part_name,size_label,models(name)),devices(name,heads)")
.eq("worker_id",p.id)
.order("created_at",{ascending:false})
.limit(80)

]);


let parts=[];


app.innerHTML=`

<div class="card">

<h2>
سلام ${esc(p.full_name)}
</h2>

<button class="secondary" id="out">
خروج
</button>

</div>


<div class="card">

<h2>
ثبت کار
</h2>


<select id="model">

<option value="">
مدل را انتخاب کن
</option>

${(models||[]).map(x=>`

<option value="${x.id}">
${esc(x.name)}
</option>

`).join("")}

</select>


<select id="part">

<option value="">
قسمت را انتخاب کن
</option>

</select>


<select id="device">

<option value="">
دستگاه را انتخاب کن
</option>

${(devices||[]).map(x=>`

<option value="${x.id}">
${esc(x.name)}
</option>

`).join("")}

</select>


<select id="type">

<option value="complete">
کار کامل
</option>

<option value="manual">
کار دستی
</option>

</select>


<input
id="qty"
type="number"
min="1"
value="1"
placeholder="تعداد کامل"
>


<input
id="manual"
class="hidden"
type="number"
min="1"
placeholder="تعداد واقعی سوزن انجام‌شده"
>

<p
id="manualHelp"
class="muted hidden"
>
برای کار دستی، تعداد واقعی سوزن کارشده را وارد کن؛
حتی اگر نصف یا بخشی از یک قسمت باشد.
</p>


<p id="calc" class="muted"></p>


<button id="save">
ثبت کار
</button>


<p id="msg"></p>

</div>


<div class="card">

<h2>
کارهای من
</h2>

<div id="list"></div>

</div>

`;


/* انتخاب مدل */

document.getElementById("model").onchange=async()=>{

const r=await sb
.from("model_parts")
.select("*,models(name)")
.eq("model_id",model.value)
.eq("active",true)
.order("part_name");

parts=r.data||[];


part.innerHTML=
'<option value="">قسمت را انتخاب کن</option>'
+
parts.map(x=>`

<option value="${x.id}">
${esc(x.part_name)}
${x.size_label?` — سایز ${esc(x.size_label)}`:""}
 — ${Number(x.needles).toLocaleString()} سوزن
</option>

`).join("");

calcIt();

};


/* محاسبه */

function calcIt(){

const pt=parts.find(
x=>String(x.id)===String(part.value)
);

let n=0;

if(type.value==="manual"){

n=Number(manual.value||0);

}else{

n=
Number(pt?.needles||0)
*
Number(qty.value||1);

}

calc.textContent=n
?
`تعداد سوزن: ${n.toLocaleString()} — مبلغ بر اساس نرخ دستگاه بعد از ثبت محاسبه می‌شود.`
:
"";

}


/* تغییر فیلدها */

[part,qty,manual].forEach(x=>
x.addEventListener("input",calcIt)
);


type.onchange=()=>{

const isManual=
type.value==="manual";


manual.classList.toggle(
"hidden",
!isManual
);


manualHelp.classList.toggle(
"hidden",
!isManual
);


qty.classList.toggle(
"hidden",
isManual
);


calcIt();

};


/* ثبت کار */

save.onclick=async()=>{

msg.className="";

const pt=parts.find(
x=>String(x.id)===String(part.value)
);


if(!pt||!device.value){

msg.textContent=
"مدل، قسمت و دستگاه را انتخاب کن";

return;

}


const isManual=
type.value==="manual";


const manualN=
isManual
?
Number(manual.value||0)
:
null;


if(isManual && manualN<=0){

msg.className="err";

msg.textContent=
"تعداد واقعی سوزن را وارد کن";

return;

}


if(!isManual &&
Number(qty.value||0)<1){

msg.className="err";

msg.textContent=
"تعداد را حداقل ۱ وارد کن";

return;

}


/*
هر بار زدن دکمه ثبت،
یک رکورد جداگانه ساخته می‌شود.
پس یک نیرو می‌تواند در یک روز
هر تعداد کار مختلف ثبت کند.
*/

const {error}=await sb
.from("work_entries")
.insert({

worker_id:p.id,

model_part_id:pt.id,

device_id:Number(device.value),

entry_type:type.value,

quantity:
isManual
?
1
:
Number(qty.value||1),

manual_needles:manualN,

status:"pending",

work_date:new Date()
.toISOString()
.slice(0,10)

});


if(error){

msg.className="err";

msg.textContent=error.message;

}else{

msg.className="success";

msg.textContent=
"ثبت شد و برای تأیید مدیر رفت.";


/*
بعد از ثبت،
فرم دوباره آماده ثبت کار بعدی می‌شود.
*/

manual.value="";

qty.value="1";

setTimeout(
()=>worker(p),
500
);

}

};


/* خروج */

out.onclick=()=>{

sb.auth.signOut().then(login);

};


/* لیست کارها */

list.innerHTML=
(entries||[])
.map(e=>`

<div class="item">

<b>
${esc(e.model_parts?.models?.name)}
—
${esc(e.model_parts?.part_name)}

${e.model_parts?.size_label
?
" — سایز "+esc(e.model_parts.size_label)
:
""}

</b>

<br>

${Number(e.total_needles).toLocaleString()}
سوزن

—

<span class="money">
${Number(e.amount).toLocaleString()}
تومان
</span>

<br>

<span class="pill">

${
e.status==="pending"
?
"در انتظار تأیید"
:
e.status==="approved"
?
"تأیید شده"
:
"رد شده"
}

</span>

<span class="muted">
${shamsi(e.work_date)}
</span>

</div>

`)
.join("")
||
'<p class="muted">هنوز کاری ثبت نشده.</p>';

}


/* =========================
   MANAGER PANEL
========================= */

async function manager(p){

const [

{data:pending},

{data:workers},

{data:today},

{data:month},

{data:models},

{data:devices}

]=await Promise.all([


sb
.from("work_entries")
.select("*,profiles!work_entries_worker_id_fkey(full_name),model_parts(part_name,size_label,models(name)),devices(name,heads)")
.eq("status","pending")
.order("created_at"),


sb
.from("profiles")
.select("id,full_name,worker_code,active")
.eq("role","worker")
.order("full_name"),


sb
.from("work_entries")
.select("amount,total_needles")
.eq("status","approved")
.eq(
"work_date",
new Date().toISOString().slice(0,10)
),


sb
.from("work_entries")
.select("amount,total_needles")
.eq("status","approved")
.gte(
"work_date",
new Date().toISOString().slice(0,7)+"-01"
),


sb
.from("models")
.select("*,model_parts(*)")
.order("name"),


sb
.from("devices")
.select("*")
.order("heads")

]);


const sum=a=>
(a||[])
.reduce(
(s,x)=>s+Number(x.amount||0),
0
);


const needles=a=>
(a||[])
.reduce(
(s,x)=>s+Number(x.total_needles||0),
0
);


app.innerHTML=`

<div class="card">

<h2>
پنل مدیریت
</h2>

<p>
سلام ${esc(p.full_name)}
</p>

<button class="secondary" id="out">
خروج
</button>

</div>


<div class="summary">

<div class="card">

<div class="num">
${Number(sum(today)).toLocaleString()}
</div>

<div class="muted">
تومان امروز
</div>

</div>


<div class="card">

<div class="num">
${Number(sum(month)).toLocaleString()}
</div>

<div class="muted">
تومان این ماه
</div>

</div>


<div class="card">

<div class="num">
${Number(needles(today)).toLocaleString()}
</div>

<div class="muted">
سوزن امروز
</div>

</div>


<div class="card">

<div class="num">
${(pending||[]).length}
</div>

<div class="muted">
منتظر تأیید
</div>

</div>

</div>


<div class="card">

<h2>
تأیید کارها
</h2>

<div id="pending"></div>

</div>


<div class="card">

<h2>
نیروها
</h2>

<div id="workers"></div>

<hr>

<h3>
افزودن نیرو
</h3>


<input
id="wname"
placeholder="نام و نام خانوادگی"
>


<input
id="wcode"
placeholder="کد نیرو، مثلاً N001"
>


<input
id="wpass"
type="text"
value="Kargah@1234"
placeholder="رمز عبور"
>


<button id="addw">
ساخت حساب نیرو
</button>


<p id="wmsg"></p>

</div>


<div class="card">

<h2>
مدل‌ها
</h2>

${(models||[])
.map(m=>`

<div class="item">

<b>
${esc(m.name)}
</b>

<br>

<span class="muted">
${m.model_parts.length}
قسمت
</span>

</div>

`)
.join("")}

</div>


<div class="card">

<h2>
دستگاه‌ها و نرخ
</h2>

${(devices||[])
.map(d=>`

<div class="item">

${esc(d.name)}
—

${Number(d.rate_per_1000).toLocaleString()}
تومان / هزار سوزن

</div>

`)
.join("")}

</div>

`;


/* کارهای منتظر تأیید */

pending.innerHTML=
(pending||[])
.map(e=>`

<div class="item">

<b>
${esc(e.profiles?.full_name)}
</b>

<br>

${esc(e.model_parts?.models?.name)}
—

${esc(e.model_parts?.part_name)}

${e.model_parts?.size_label
?
" — سایز "+esc(e.model_parts.size_label)
:
""}

<br>

${Number(e.total_needles).toLocaleString()}
سوزن

—

${Number(e.amount).toLocaleString()}
تومان


<button
class="ok"
data-ok="${e.id}"
>
تأیید
</button>


<button
class="danger"
data-no="${e.id}"
>
رد
</button>

</div>

`)
.join("")
||
'<p class="muted">موردی برای تأیید نیست.</p>';


/* لیست نیروها */

workers.innerHTML=
(workers||[])
.map(w=>`

<div class="item">

<b>
${esc(w.full_name)}
</b>

<br>

<span class="muted">
کد نیرو: ${esc(w.worker_code||"—")}
</span>

${w.active
?
""
:
'<span class="pill">غیرفعال</span>'
}

</div>

`)
.join("")
||
'<p class="muted">نیرویی ثبت نشده.</p>';


/* تأیید */

document
.querySelectorAll("[data-ok]")
.forEach(b=>

b.onclick=async()=>{

const {error}=await sb
.from("work_entries")
.update({

status:"approved",

approved_at:
new Date().toISOString(),

approved_by:p.id

})
.eq("id",b.dataset.ok)
.eq("status","pending");


if(error){

alert(error.message);

}else{

manager(p);

}

}

);


/* رد */

document
.querySelectorAll("[data-no]")
.forEach(b=>

b.onclick=async()=>{

const {error}=await sb
.from("work_entries")
.update({

status:"rejected",

rejected_at:
new Date().toISOString(),

rejected_by:p.id

})
.eq("id",b.dataset.no)
.eq("status","pending");


if(error){

alert(error.message);

}else{

manager(p);

}

}

);


/* ساخت نیرو */

addw.onclick=async()=>{

wmsg.textContent="";

const name=wname.value.trim();

const code=wcode.value.trim();

const password=wpass.value;


if(!name){

wmsg.className="err";

wmsg.textContent=
"نام نیرو را وارد کن";

return;

}


if(!code){

wmsg.className="err";

wmsg.textContent=
"کد نیرو را وارد کن";

return;

}


if(!password){

wmsg.className="err";

wmsg.textContent=
"رمز عبور را وارد کن";

return;

}


const {
data:{session}
}=await sb.auth.getSession();


if(!session){

wmsg.className="err";

wmsg.textContent=
"نشست مدیر منقضی شده؛ دوباره وارد شو.";

return;

}


try{

const r=await fetch(

API+"/worker",

{

method:"POST",

headers:{

Authorization:
"Bearer "+session.access_token,

apikey:SUPA_KEY,

"Content-Type":
"application/json"

},

body:JSON.stringify({

code:code,

password:password,

full_name:name

})

}

);


const j=await r.json();


if(j.error){

wmsg.className="err";

wmsg.textContent=j.error;

}else{

wmsg.className="success";

wmsg.textContent=
"حساب نیرو ساخته شد.";

setTimeout(
()=>manager(p),
700
);

}

}catch(e){

wmsg.className="err";

wmsg.textContent=
e.message;

}

};


/* خروج */

out.onclick=()=>{

sb.auth.signOut().then(login);

};

}


/* =========================
   AUTH STATE
========================= */

sb.auth.onAuthStateChange(
()=>setTimeout(render,0)
);


/* =========================
   START
========================= */

(async()=>{

const {
data:{session}
}=await sb.auth.getSession();


if(!session){

login();

return;

}


/*
bootstrap فقط برای اولین حساب مدیر
استفاده می‌شود.
*/

const b=await bootstrap();


if(b?.error && b?.ok!==true){

/*
اگر مدیر از قبل وجود داشته باشد،
خطای bootstrap مانع ورود نمی‌شود.
*/

}


const p=await me();


if(p){

render();

}else{

login();

}

})();

</script>

</body>
</html>
