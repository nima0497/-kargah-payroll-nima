<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>کارکرد کارگاه</title>
</head>
<body>
<p style="font-family:sans-serif;text-align:center">در حال بارگذاری…</p>
<script>
(async()=>{
try{
const r=await fetch("https://dkwlbxlzzxtsoslzppot.supabase.co/functions/v1/kargah",{cache:"no-store"});
if(!r.ok)throw new Error("HTTP "+r.status);
const h=await r.text();
document.open();
document.write(h);
document.close();
}catch(e){
document.body.innerHTML='<p style="font-family:sans-serif;text-align:center;color:#b91c1c">خطا در بارگذاری برنامه: '+String(e.message||e)+'</p>';
}
})();
</script>
</body>
</html>
