<div id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPA_URL="https://dkwlbxlzzxtsoslzppot.supabase.co";

const SUPA_KEY="sb_publishable__CTj81JM5kWr4DddanPIXQ_8y7Xl2eW";

const API=SUPA_URL+"/functions/v1/kargah";

const sb=supabase.createClient(SUPA_URL,SUPA_KEY);

const app=document.querySelector("#app");


/* =========================
   HELPERS
========================= */

const esc=s=>String(s??"").replace(
/[&<>"']/g,
m=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[m])
);


/* تاریخ امروز به میلادی، بر اساس ساعت خود گوشی */

function todayISO(){

const d=new Date();

const y=d.getFullYear();

const m=String(d.getMonth()+1).padStart(2,"0");

const day=String(d.getDate()).padStart(2,"0");

return `${y}-${m}-${day}`;

}


/* تاریخ شمسی واقعی */

function shamsi(dateValue){

if(!dateValue)return "";

let d;

if(String(dateValue).length===10){

const [y,m,day]=String(dateValue).split("-");

d=new Date(
Number(y),
Number(m)-1,
Number(day)
);

}else{

d=new Date(dateValue);

}

if(Number.isNaN(d.getTime()))return "";

return new Intl.DateTimeFormat(
"fa-IR-u-ca-persian-nu-latn",
{
year:"numeric",
month:"2-digit",
day:"2-digit"
}
).format(d);

}


function money(n){

return Number(n||0).toLocaleString("fa-IR");

}


function num(n){

return Number(n||0).toLocaleString("fa-IR");

}


/* =========================
   LOGIN
========================= */

function login(){

app.innerHTML=`

<div class="card">

<h1>کارکرد کارگاه</h1>

<p class="muted">
ورود مدیر یا نیرو
</p>

<input
id="loginid"
placeholder="ایمیل مدیر یا کد نیرو"
>

<input
id="pass"
type="password"
placeholder="رمز عبور"
>

<button id="in">
ورود
</button>

<p id="msg" class="muted"></p>

</div>

`;

const loginBtn=document.getElementById("in");

loginBtn.onclick=async()=>{

const msg=document.getElementById("msg");

msg.textContent="";
msg.className="muted";

const raw=document.getElementById("loginid").value.trim();

const password=document.getElementById("pass").value;

if(!raw){

msg.textContent="ایمیل یا کد نیرو را وارد کن";

return;

}

if(!password){

msg.textContent="رمز عبور را وارد کن";

return;

}

const email=raw.includes("@")
?
raw
:
(raw.toLowerCase()+"@kargah.local");

const {error}=await sb.auth.signInWithPassword({

email,
password

});

if(error){

msg.className="err";

msg.textContent=error.message;

}else{

render();

}

};

}


/* =========================
   CURRENT USER
========================= */

async function me(){

const {
data:{user}
}=await sb.auth.getUser();

if(!user)return null;

const {
data:p
}=await sb
.from("profiles")
.select("*")
.eq("id",user.id)
.single();

return p||null;

}


/* =========================
   BOOTSTRAP
========================= */

async function bootstrap(){

const {
data:{session}
}=await sb.auth.getSession();

if(!session)return null;

try{

const r=await fetch(
API+"/bootstrap",
{
method:"POST",
headers:{
Authorization:"Bearer "+session.access_token,
apikey:SUPA_KEY,
"Content-Type":"application/json"
}
}
);

return await r.json();

}catch(e){

return {
error:e.message
};

}

}


/* =========================
   RENDER
========================= */

async function render(){

const p=await me();

if(!p){

login();

return;

}

if(p.role==="manager"){

manager(p);

}else{

worker(p);

}

}


/* =========================
   WORKER
========================= */

async function worker(p){

const today=todayISO();

const [
modelsRes,
devicesRes,
entriesRes,
dayRes,
adjustmentsRes
]=await Promise.all([

sb
.from("models")
.select("*")
.eq("active",true)
.order("name"),

sb
.from("devices")
.select("id,name,heads,active")
.eq("active",true)
.order("heads"),

sb
.from("work_entries")
.select(`
*,
model_parts(part_name,size_label,models(name),required_quantity),
devices(name,heads),
production_garments(garment_no,size_label,status)
`)
.eq("worker_id",p.id)
.order("created_at",{ascending:false})
.limit(100),

sb
.from("worker_day_status")
.select("*")
.eq("worker_id",p.id)
.eq("work_date",today)
.maybeSingle(),

sb
.from("work_adjustments")
.select("*")
.eq("worker_id",p.id)
.eq("work_date",today)
.order("created_at",{ascending:false})

]);

const models=modelsRes.data||[];

const devices=devicesRes.data||[];

const entries=entriesRes.data||[];

const dayClosed=!!dayRes.data;

const adjustments=adjustmentsRes.data||[];

let parts=[];


app.innerHTML=`

<div class="card">

<h2>
سلام ${esc(p.full_name)}
</h2>

<p class="muted">
امروز ${shamsi(today)}
</p>

<button class="secondary" id="out">
خروج
</button>

</div>


<div class="card">

<h2>
لباس جاری
</h2>

<div id="garmentInfo" class="current">

مدل را انتخاب کن تا لباس جاری نمایش داده شود.

</div>

</div>


${
dayClosed
?
`
<div class="card">

<div class="locked">

کار امروز شما پایان یافته است.

<br>

از این لحظه امکان ثبت کار جدید برای امروز وجود ندارد.

</div>

</div>
`
:
`
<div class="card">

<h2>
ثبت کار
</h2>


<select id="model">

<option value="">
مدل را انتخاب کن
</option>

${models.map(x=>`

<option value="${x.id}">
${esc(x.name)}
</option>

`).join("")}

</select>


<select id="part">

<option value="">
قسمت را انتخاب کن
</option>

</select>


<select id="device">

<option value="">
دستگاه را انتخاب کن
</option>

${devices.map(x=>`

<option value="${x.id}">
${esc(x.name)}
</option>

`).join("")}

</select>


<select id="type">

<option value="complete">
کار کامل
</option>

<option value="manual">
کار دستی / ناقص
</option>

</select>


<input
id="qty"
type="number"
min="0.001"
step="0.001"
value="1"
placeholder="تعداد انجام‌شده"
>


<input
id="manual"
class="hidden"
type="number"
min="1"
step="1"
placeholder="تعداد واقعی سوزن انجام‌شده"
>


<p
id="manualHelp"
class="muted hidden"
>
در حالت دستی، تعداد واقعی سوزن را وارد کن.
حداکثر آن به اندازه سوزن پیش‌فرض همان قسمت است.
</p>


<input
id="note"
placeholder="یادداشت این کار (اختیاری)"
>


<p id="calc" class="muted"></p>


<button id="save">
ثبت کار
</button>


<p id="msg"></p>

</div>
`
}


${
!dayClosed
?
`
<div class="card">

<h3>
پایان کار امروز
</h3>

<p class="muted">
بعد از زدن این دکمه دیگر برای امروز امکان ثبت کار جدید نداری.
</p>

<button class="danger" id="finishDay">
اتمام کار امروز من
</button>

</div>
`
:
""
}


<div class="card">

<h2>
کارهای من
</h2>

<div id="list"></div>

</div>


<div class="card">

<h2>
اصلاحیه‌های امروز
</h2>

<div id="adjustments"></div>

</div>

`;


const out=document.getElementById("out");

out.onclick=()=>{

sb.auth.signOut().then(login);

};


/* =========================
   CURRENT GARMENT INFO
========================= */

async function refreshGarmentInfo(){

const info=document.getElementById("garmentInfo");

const modelEl=document.getElementById("model");

if(!info||!modelEl||!modelEl.value){

if(info){

info.innerHTML=
"مدل را انتخاب کن تا لباس جاری نمایش داده شود.";

}

return;

}

const {data:g}=await sb
.from("production_garments")
.select("*")
.eq("worker_id",p.id)
.eq("model_id",Number(modelEl.value))
.eq("status","open")
.order("garment_no",{ascending:false})
.limit(1)
.maybeSingle();

if(g){

info.innerHTML=`

<b>
لباس شماره ${num(g.garment_no)}
</b>

<br>

${
g.size_label
?
`سایز: <b>${esc(g.size_label)}</b>`
:
`سایز هنوز مشخص نشده؛ با ثبت پندول یا دن‌کار مشخص می‌شود.`
}

`;

}else{

info.innerHTML=`

هنوز لباس جاری برای این مدل ساخته نشده.

<br>

<span class="muted">
اولین ثبت کار، لباس بعدی را به‌صورت خودکار شروع می‌کند.
</span>

`;

}

}


/* =========================
   MODEL
========================= */

if(!dayClosed){

const modelEl=document.getElementById("model");

const partEl=document.getElementById("part");

const deviceEl=document.getElementById("device");

const typeEl=document.getElementById("type");

const qtyEl=document.getElementById("qty");

const manualEl=document.getElementById("manual");

const manualHelp=document.getElementById("manualHelp");

const calcEl=document.getElementById("calc");

const saveEl=document.getElementById("save");

const msgEl=document.getElementById("msg");

const noteEl=document.getElementById("note");


modelEl.onchange=async()=>{

const r=await sb
.from("model_parts")
.select("*,models(name)")
.eq("model_id",modelEl.value)
.eq("active",true)
.order("part_name")
.order("size_label");

parts=r.data||[];

partEl.innerHTML=
`
<option value="">
قسمت را انتخاب کن
</option>
`
+
parts.map(x=>`

<option value="${x.id}">
${esc(x.part_name)}
${x.size_label
?
` — سایز ${esc(x.size_label)}`
:
""}
 — ${num(x.needles)} سوزن
</option>

`).join("");

calcIt();

refreshGarmentInfo();

};


partEl.onchange=()=>{

const pt=parts.find(
x=>String(x.id)===String(partEl.value)
);

if(pt){

qtyEl.max=pt.required_quantity||1;

manualEl.max=pt.needles;

if(
Number(qtyEl.value||0)>
Number(pt.required_quantity||1)
){

qtyEl.value=pt.required_quantity||1;

}

}

calcIt();

};


function calcIt(){

const pt=parts.find(
x=>String(x.id)===String(partEl.value)
);

let n=0;

if(typeEl.value==="manual"){

n=Number(manualEl.value||0);

}else{

n=
Number(pt?.needles||0)
*
Number(qtyEl.value||0);

}

calcEl.textContent=n
?
`تعداد سوزن: ${num(n)} — مبلغ بر اساس نرخ دستگاه بعد از ثبت محاسبه می‌شود.`
:
"";

}


[partEl,qtyEl,manualEl].forEach(x=>
x.addEventListener("input",calcIt)
);


typeEl.onchange=()=>{

const isManual=
typeEl.value==="manual";

manualEl.classList.toggle(
"hidden",
!isManual
);

manualHelp.classList.toggle(
"hidden",
!isManual
);

qtyEl.classList.toggle(
"hidden",
isManual
);

calcIt();

};


saveEl.onclick=async()=>{

msgEl.className="";

const pt=parts.find(
x=>String(x.id)===String(partEl.value)
);

if(!pt||!deviceEl.value){

msgEl.className="err";

msgEl.textContent=
"مدل، قسمت و دستگاه را انتخاب کن";

return;

}

const isManual=
typeEl.value==="manual";

let quantity;

let manualNeedles=null;

if(isManual){

manualNeedles=
Number(manualEl.value||0);

if(manualNeedles<=0){

msgEl.className="err";

msgEl.textContent=
"تعداد واقعی سوزن را وارد کن";

return;

}

if(manualNeedles>Number(pt.needles)){

msgEl.className="err";

msgEl.textContent=
`حداکثر سوزن دستی این قسمت ${num(pt.needles)} است`;

return;

}

}else{

quantity=
Number(qtyEl.value||0);

if(quantity<=0){

msgEl.className="err";

msgEl.textContent=
"تعداد انجام‌شده را وارد کن";

return;

}

if(quantity>Number(pt.required_quantity||1)){

msgEl.className="err";

msgEl.textContent=
`حداکثر مقدار این قسمت برای یک لباس ${pt.required_quantity} است`;

return;

}

}


const {error}=await sb
.from("work_entries")
.insert({

worker_id:p.id,

model_part_id:pt.id,

device_id:Number(deviceEl.value),

entry_type:typeEl.value,

quantity:isManual?1:quantity,

manual_needles:manualNeedles,

status:"pending",

work_date:today,

note:noteEl.value.trim()||null

});


if(error){

msgEl.className="err";

msgEl.textContent=error.message;

}else{

msgEl.className="success";

msgEl.textContent=
"ثبت شد و برای تأیید مدیر رفت.";

noteEl.value="";

manualEl.value="";

qtyEl.value="1";

setTimeout(
()=>worker(p),
600
);

}

};


/* =========================
   FINISH DAY
========================= */

document.getElementById("finishDay").onclick=async()=>{

const ok=confirm(
"مطمئنی کار امروزت تمام شده؟ بعد از تأیید، دیگر امکان ثبت کار جدید برای امروز نداری."
);

if(!ok)return;

const {error}=await sb
.from("worker_day_status")
.insert({

worker_id:p.id,

work_date:today

});

if(error){

alert(error.message);

}else{

worker(p);

}

};

}


/* =========================
   WORKER LIST
========================= */

document.getElementById("list").innerHTML=
entries.map(e=>`

<div class="item">

<b>

${esc(e.model_parts?.models?.name)}
—

${esc(e.model_parts?.part_name)}

${
e.model_parts?.size_label
?
` — سایز ${esc(e.model_parts.size_label)}`
:
""
}

</b>

<br>

${
e.production_garments
?
`
<span class="pill">
لباس شماره ${num(e.production_garments.garment_no)}
</span>

${
e.production_garments.size_label
?
`
<span class="pill">
سایز ${esc(e.production_garments.size_label)}
</span>
`
:
""
}
`
:
""
}

<br>

${num(e.total_needles)}
سوزن

—

<span class="money">
${money(e.amount)}
تومان
</span>

<br>

<span class="pill">

?
"تأیید شده"

}

</span>

<span class="muted">
${shamsi(e.work_date)}
</span>

${
e.note
?
`
<div class="note">

</div>

""
}

</div>

`)
.join("")
||
'<p class="muted">هنوز کاری ثبت نشده.</p>';


/* =========================
   ADJUSTMENTS WORKER
========================= */

document.getElementById("adjustments").innerHTML=
adjustments.map(a=>`

<div class="item">

<b>
${num(a.needles)} سوزن
</b>

<br>

${money(a.amount)}
تومان

${
a.note
?
`
<div class="note">
${esc(a.note)}
</div>
`
:
""
}

</div>

`)
.join("")
||
'<p class="muted">اصلاحیه‌ای برای امروز ثبت نشده.</p>';

}


/* =========================
   MANAGER
========================= */

async function manager(p){

const today=todayISO();

const monthStart=today.slice(0,7)+"-01";


const [
pendingRes,
workersRes,
todayRes,
monthRes,
todayAdjRes,
monthAdjRes,
modelsRes,
devicesRes
]=await Promise.all([


sb
.from("work_entries")
.select(`
*,
profiles!work_entries_worker_id_fkey(full_name,worker_code),
model_parts(part_name,size_label,models(name)),
devices(name,heads),
production_garments(garment_no,size_label)
`)
.eq("status","pending")
.order("created_at"),


sb
.from("profiles")
.select("id,full_name,worker_code,active")
.eq("role","worker")
.order("full_name"),


sb
.from("work_entries")
.select("amount,total_needles")
.eq("status","approved")
.eq("work_date",today),


sb
.from("work_entries")
.select("amount,total_needles")
.eq("status","approved")
.gte("work_date",monthStart),


sb
.from("work_adjustments")
.select("amount,needles")
.eq("work_date",today),


sb
.from("work_adjustments")
.select("amount,needles")
.gte("work_date",monthStart),


sb
.from("models")
.select("*,model_parts(*)")
.order("name"),


sb
.from("devices")
.select("*")
.order("heads")

]);


const pending=pendingRes.data||[];

const workers=workersRes.data||[];

/* اینجا مشکل صفحه سفید اصلاح شده */
const todayEntries=todayRes.data||[];

const month=monthRes.data||[];

const todayAdj=todayAdjRes.data||[];

const monthAdj=monthAdjRes.data||[];

const models=modelsRes.data||[];

const devices=devicesRes.data||[];


const sum=a=>
(a||[])
.reduce(
(s,x)=>s+Number(x.amount||0),
0
);


const needles=a=>
(a||[])
.reduce(
(s,x)=>s+Number(x.total_needles||x.needles||0),
0
);


app.innerHTML=`

<div class="card">

<h2>
پنل مدیریت
</h2>

<p>
سلام ${esc(p.full_name)}
</p>

<p class="muted">
امروز ${shamsi(today)}
</p>

<button class="secondary" id="out">
خروج
</button>

</div>


<div class="summary">

<div class="card">

<div class="num">
${money(sum(todayEntries)+sum(todayAdj))}
</div>

<div class="muted">
تومان امروز
</div>

</div>


<div class="card">

<div class="num">
${money(sum(month)+sum(monthAdj))}
</div>

<div class="muted">
تومان این ماه
</div>

</div>


<div class="card">

<div class="num">
${num(needles(todayEntries)+needles(todayAdj))}
</div>

<div class="muted">
سوزن امروز
</div>

</div>


<div class="card">

<div class="num">
${pending.length}
</div>

<div class="muted">
منتظر تأیید
</div>

</div>

/* =========================
   ADJUSTMENT CALC
========================= */

const adjNeedles=document.getElementById("adjNeedles");

const adjRate=document.getElementById("adjRate");

const adjCalc=document.getElementById("adjCalc");

function calcAdjustment(){

const n=Number(adjNeedles.value||0);

const r=Number(adjRate.value||0);

const amount=n*r/1000;

adjCalc.textContent=
n&&r
?
`مبلغ اصلاحیه: ${money(amount)} تومان`
:
"";

}

adjNeedles.oninput=calcAdjustment;

adjRate.oninput=calcAdjustment;


/* =========================
   ADD ADJUSTMENT
========================= */

document.getElementById("addAdj").onclick=async()=>{

const workerId=
document.getElementById("adjWorker").value;

const n=
Number(document.getElementById("adjNeedles").value||0);

const rate=
Number(document.getElementById("adjRate").value||0);

const note=
document.getElementById("adjNote").value.trim();

const msg=
document.getElementById("adjMsg");

msg.className="";

if(!workerId){

msg.className="err";

msg.textContent="نیرو را انتخاب کن";

return;

}

if(n<=0){

msg.className="err";

msg.textContent="تعداد سوزن اصلاحیه را وارد کن";

return;

}

if(rate<0){

msg.className="err";

msg.textContent="نرخ را درست وارد کن";

return;

}

const amount=n*rate/1000;

const {error}=await sb
.from("work_adjustments")
.insert({

worker_id:workerId,

work_date:today,

needles:n,

rate_per_1000:rate,

amount:amount,

note:note||null,

created_by:p.id

});

if(error){

msg.className="err";

msg.textContent=error.message;

}else{

msg.className="success";

msg.textContent=
"اصلاحیه ثبت شد.";

setTimeout(
()=>manager(p),
600
);

}

};


/* =========================
   ADD WORKER
========================= */

document.getElementById("addw").onclick=async()=>{

const wmsg=document.getElementById("wmsg");

wmsg.textContent="";

const name=
document.getElementById("wname").value.trim();

const code=
document.getElementById("wcode").value.trim();

const password=
document.getElementById("wpass").value;


if(!name){

wmsg.className="err";

wmsg.textContent="نام نیرو را وارد کن";

return;

}

if(!code){

wmsg.className="err";

wmsg.textContent="کد نیرو را وارد کن";

return;

}

if(!password){

wmsg.className="err";

wmsg.textContent="رمز عبور را وارد کن";

return;

}


const {
data:{session}
}=await sb.auth.getSession();


if(!session){

wmsg.className="err";

wmsg.textContent=
"نشست مدیر منقضی شده؛ دوباره وارد شو.";

return;

}


try{

const r=await fetch(

API+"/worker",

{

method:"POST",

headers:{

Authorization:
"Bearer "+session.access_token,

apikey:SUPA_KEY,

"Content-Type":
"application/json"

},

body:JSON.stringify({

code,

password,

full_name:name

})

}

);


const j=await r.json();


if(j.error){

wmsg.className="err";

wmsg.textContent=j.error;

}else{

wmsg.className="success";

wmsg.textContent=
"حساب نیرو ساخته شد.";

setTimeout(
()=>manager(p),
700
);

}

}catch(e){

wmsg.className="err";

wmsg.textContent=e.message;

}

};
